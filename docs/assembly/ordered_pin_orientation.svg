<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Inboard-to-outboard orientation and pin insertion key</title>
  <desc id="desc">Schematic, not to scale. The stand and motor housing are inboard. At the shoulder, the stationary plate precedes the rotating hub and proximal root. At the knee, the steel D10 pin enters through the first proximal bearing, distal receiver, and second proximal bearing from inboard; an outboard spacer and bracket follow. Each clevis pin enters inboard to outboard, followed by a steel washer and cotter. The stop dowel is captured between its distal blind socket and the stop plate's closed outboard skin.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#245f88"/>
    </marker>
  </defs>
  <rect width="1200" height="710" fill="#f7f9fb"/>
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1d2730">Orientation key — left ABS test leg</text>
  <text x="60" y="85" font-family="Arial, sans-serif" font-size="19" fill="#334552">Axial order and entry direction only; shapes and spacing are schematic.</text>
  <line x1="145" y1="125" x2="1060" y2="125" stroke="#245f88" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="65" y="118" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#245f88">INBOARD</text>
  <text x="1060" y="118" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#245f88">OUTBOARD</text>
  <text x="65" y="150" font-family="Arial, sans-serif" font-size="17" fill="#334552">toward stand/body</text>
  <text x="1010" y="150" font-family="Arial, sans-serif" font-size="17" fill="#334552">away from stand</text>

  <line x1="55" y1="177" x2="1145" y2="177" stroke="#c7d1d9" stroke-width="2"/>
  <text x="60" y="210" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d2730">Shoulder</text>
  <rect x="205" y="190" width="165" height="70" rx="9" fill="#d9e4ec" stroke="#55758b" stroke-width="2"/>
  <rect x="395" y="190" width="126" height="70" rx="9" fill="#e9edf0" stroke="#687987" stroke-width="2"/>
  <rect x="546" y="190" width="190" height="70" rx="9" fill="#d7e9f3" stroke="#245f88" stroke-width="2"/>
  <rect x="761" y="190" width="205" height="70" rx="9" fill="#e7dcca" stroke="#8d704c" stroke-width="2"/>
  <text x="287" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#1d2730">GIM6010</text>
  <text x="287" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">housing + rotor</text>
  <text x="458" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">stationary</text>
  <text x="458" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">shoulder plate</text>
  <text x="641" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">NEW rotating hub</text>
  <text x="641" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">3 root dowels</text>
  <text x="863" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">NEW proximal root</text>
  <text x="863" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">6 M4 clamp screws</text>
  <path d="M 370 225 H 390 M 521 225 H 541 M 736 225 H 756" stroke="#245f88" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="205" y="287" font-family="Arial, sans-serif" font-size="17" fill="#334552">Plate slides over the bare rotor before the hub is fitted.</text>

  <line x1="55" y1="310" x2="1145" y2="310" stroke="#c7d1d9" stroke-width="2"/>
  <text x="60" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d2730">Knee pin</text>
  <line x1="205" y1="367" x2="790" y2="367" stroke="#245f88" stroke-width="10" marker-end="url(#arrow)"/>
  <rect x="312" y="327" width="120" height="80" rx="8" fill="#e7dcca" stroke="#8d704c" stroke-width="2"/>
  <rect x="455" y="327" width="195" height="80" rx="8" fill="#d9e4ec" stroke="#55758b" stroke-width="2"/>
  <rect x="673" y="327" width="120" height="80" rx="8" fill="#e7dcca" stroke="#8d704c" stroke-width="2"/>
  <rect x="816" y="327" width="198" height="80" rx="8" fill="#e9edf0" stroke="#687987" stroke-width="2"/>
  <text x="372" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1d2730">proximal</text>
  <text x="372" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">bearing 1</text>
  <text x="552" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1d2730">NEW distal</text>
  <text x="552" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">D10 receiver</text>
  <text x="733" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1d2730">proximal</text>
  <text x="733" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">bearing 2</text>
  <text x="915" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1d2730">spacer + bracket</text>
  <text x="915" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">outboard keeper</text>
  <text x="206" y="439" font-family="Arial, sans-serif" font-size="17" fill="#334552">Insert the steel D10 pin from inboard. The outboard keeper is test-only; retain hand control.</text>

  <line x1="55" y1="464" x2="1145" y2="464" stroke="#c7d1d9" stroke-width="2"/>
  <text x="60" y="500" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d2730">Clevis pins</text>
  <rect x="208" y="484" width="105" height="64" rx="8" fill="#d9e4ec" stroke="#55758b" stroke-width="2"/>
  <rect x="338" y="484" width="390" height="64" rx="8" fill="#e7dcca" stroke="#8d704c" stroke-width="2"/>
  <rect x="753" y="484" width="90" height="64" rx="8" fill="#e9edf0" stroke="#687987" stroke-width="2"/>
  <rect x="869" y="484" width="105" height="64" rx="8" fill="#f2dfb0" stroke="#9a7531" stroke-width="2"/>
  <text x="260" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">pin head</text>
  <text x="533" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">link + cartridge eye</text>
  <text x="533" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">integral printed lands</text>
  <text x="798" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">washer</text>
  <text x="922" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">cotter</text>
  <path d="M 314 516 H 334 M 729 516 H 749 M 844 516 H 865" stroke="#245f88" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="208" y="579" font-family="Arial, sans-serif" font-size="17" fill="#334552">Both M4 × 40 pins enter inboard → outboard; cotters point radially away from the knee.</text>

  <line x1="55" y1="605" x2="1145" y2="605" stroke="#c7d1d9" stroke-width="2"/>
  <text x="60" y="643" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d2730">Stop pin</text>
  <rect x="205" y="620" width="235" height="62" rx="8" fill="#d9e4ec" stroke="#55758b" stroke-width="2"/>
  <rect x="468" y="620" width="115" height="62" rx="8" fill="#f2dfb0" stroke="#9a7531" stroke-width="2"/>
  <rect x="611" y="620" width="340" height="62" rx="8" fill="#e7dcca" stroke="#8d704c" stroke-width="2"/>
  <text x="322" y="657" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">distal blind socket</text>
  <text x="525" y="657" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">Ø6 dowel</text>
  <text x="781" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d2730">NEW stop plate channel</text>
  <text x="781" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334552">closed skin faces outboard</text>
  <path d="M 441 651 H 464 M 584 651 H 607" stroke="#245f88" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
