name: Mechanical release integrity
on: [push, pull_request]
jobs:
  release-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_mechanical_release.py
      - run: python verify_r2a_release.py
      - run: python verify_r2a_poc_release.py
